interface:
  display_name: "LCT 本地化工作流"
  short_description: "先开启 WebUI，按分区确认多代理，模型翻译复核后提交待审草稿"
  default_prompt: "使用 $lct-localization 先启动或复用并打开正确项目的 WebUI，核验界面与 MCP 绑定，再确认任务范围；实际翻译或批量校对前，按具体分区和剩余工作量询问用户是否启用多代理，未经确认不派发；执行器隔离未验证或 MCP 未绑定有效首次草稿许可时不翻译。读取适用语料、角色研究与上游文风规范，由执行模型翻译并复核语义及口吻，仅通过 LCT 提交获准的待审草稿；只读审计或 Skill 维护不触发翻译，已暂停或作废任务不得自动恢复。"
